name: Published vectors

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tooling/verify-dip13-vectors.mjs'
      - 'tooling/verify-mhfe-vector.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vectors.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tooling/verify-dip13-vectors.mjs'
      - 'tooling/verify-mhfe-vector.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay published and embedded vectors
        run: pnpm test:vectors
