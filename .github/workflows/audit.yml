name: RustSec audit

on:
  push:
    paths:
      - "packages/**/rust/Cargo.toml"
      - "packages/**/rust/Cargo.lock"
      - "apps/key-derivation/launcher/Cargo.toml"
      - "apps/key-derivation/launcher/Cargo.lock"
      - ".github/workflows/audit.yml"
      - "tooling/wasm-modules.mjs"
      - "tooling/wasm-catalog.mjs"
  pull_request:
    paths:
      - "packages/**/rust/Cargo.toml"
      - "packages/**/rust/Cargo.lock"
      - "apps/key-derivation/launcher/Cargo.toml"
      - "apps/key-derivation/launcher/Cargo.lock"
      - ".github/workflows/audit.yml"
      - "tooling/wasm-modules.mjs"
      - "tooling/wasm-catalog.mjs"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustsec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Project native crates from the build catalog
        id: catalog
        run: echo "matrix=$(node tooling/wasm-catalog.mjs audit)" >> "$GITHUB_OUTPUT"

  audit:
    needs: catalog
    name: ${{ matrix.crate }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit ${{ matrix.lockfile }} against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
          file: ${{ matrix.lockfile }}
