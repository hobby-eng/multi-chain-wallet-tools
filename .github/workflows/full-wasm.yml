name: Full pinned Rust and WASM verification

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: true
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild and verify the complete project in the canonical container
        run: |
          docker build --platform linux/amd64 \
            --file Dockerfile.reproducible \
            --target artifacts \
            --tag multi-chain-wallet-tools-full-wasm:${GITHUB_SHA} \
            .
