name: Check pinned upstream versions

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-versions
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned toolchains and Dash dependencies with upstream
        id: versions
        run: |
          set +e
          node tooling/check-upstream-versions.mjs > upstream-version-report.md 2>&1
          exit_code=$?
          set -e
          case "$exit_code" in
            0|1|2) ;;
            *)
              original_report=$(cat upstream-version-report.md)
              {
                echo '# Pinned upstream dependency checker failed'
                echo
                echo '**Infrastructure/parser failure — this is not an update-available signal.**'
                echo
                echo "The checker process exited unexpectedly with status ${exit_code}."
                echo
                printf '%s\n' "$original_report"
              } > upstream-version-report.md
              exit_code=2
              ;;
          esac
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the dependency review issue
        if: steps.versions.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Pinned upstream dependency updates are available'
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file upstream-version-report.md
          else
            gh issue create --title "$title" --body-file upstream-version-report.md
          fi

      - name: Close a resolved dependency review issue
        if: steps.versions.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Pinned upstream dependency updates are available'
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment 'All monitored pins now match their latest reviewed upstream releases.'
          fi

      - name: Open or refresh the checker failure issue
        if: steps.versions.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Pinned upstream dependency checker failed'
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file upstream-version-report.md
          else
            gh issue create --title "$title" --body-file upstream-version-report.md
          fi

      - name: Close a resolved checker failure issue
        if: steps.versions.outputs.exit_code != '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Pinned upstream dependency checker failed'
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment 'The upstream dependency checker is healthy again.'
          fi

      - name: Fail when review or checker repair is required
        if: steps.versions.outputs.exit_code != '0'
        run: |
          cat upstream-version-report.md
          exit 1
