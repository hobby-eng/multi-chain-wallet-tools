name: Build and publish GitHub release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the publish job, which runs no dependency code, may write the release,
# request an OIDC token and store attestations: a step that installs or runs dependencies (the
# browser suites, the builds) must not be able to sign or publish under this workflow's identity.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build standalone HTML from committed WASM
        run: pnpm build:html

      - name: Run direct-file browser acceptance
        run: pnpm test:browser:files

      - name: Run extended browser regressions
        run: pnpm test:browser:regressions

      - name: Run selective-build browser smoke
        run: pnpm test:browser:selective

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Everything except the macOS executables, built and verified in the pinned containers.
  release:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the tag to match package.json
        run: |
          EXPECTED_TAG="v$(jq --raw-output '.version' package.json)"
          # A release candidate of the version, such as v0.1.5-rc.1, is published as a pre-release.
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ] && [[ ! "$GITHUB_REF_NAME" =~ ^${EXPECTED_TAG//./\\.}-rc\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Verify sources and build release assets in the canonical container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.reproducible \
            --build-arg SOURCE_COMMIT=${GITHUB_SHA} \
            --build-arg SOURCE_DIRTY=false \
            --target artifacts \
            --tag multi-chain-wallet-tools-release:${GITHUB_SHA} \
            .
          container_id=$(docker create multi-chain-wallet-tools-release:${GITHUB_SHA} /bin/true)
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/dist/." dist
          cat dist/multi-chain-edition/release/SHA256SUMS

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build the Linux and Windows executables around the canonical pages
        run: node tooling/build-launchers-reproducible.mjs

      - name: Keep the canonical build for the macOS and publishing jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The executable Key Derivation Tool for macOS needs Apple's SDK, so a macOS runner builds it from
  # the page of the canonical build. It is covered by the SHA256SUMS and attestations below.
  macos:
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned Rust toolchain and the macOS targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          cargo fetch --locked --manifest-path apps/key-derivation/launcher/Cargo.toml

      - name: Take the canonical build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-dist
          path: dist

      - name: Build the macOS executables around the canonical page
        run: |
          node tooling/build-key-derivation-launchers.mjs --profile multi-chain \
            --platforms macos-aarch64,macos-x86_64

      - name: Keep the macOS executables for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-launchers
          path: dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-macos-*
          if-no-files-found: error
          retention-days: 7

  # Every executable is started on its own system before anything is published, as launchers.yml
  # does on main: the served page and headers, refusals, isolation, fast mode and an MHFE worker in
  # Chromium, no requests and no storage. The release must not ship a program nobody has run.
  launchers:
    needs: [release, macos]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Take the canonical build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-dist
          path: dist

      - name: Take the macOS executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-launchers
          path: dist/multi-chain-edition/key-derivation

      # A downloaded artifact loses its executable bit, as a browser download does.
      - name: Allow the executable to run
        if: runner.os != 'Windows'
        run: chmod +x dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-*

      - name: Run the executable and check the page it serves
        run: node tooling/verify-key-derivation-launcher.mjs

  publish:
    needs: [release, macos, launchers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Take the canonical build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-dist
          path: dist

      - name: Take the macOS executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-launchers
          path: dist/multi-chain-edition/key-derivation

      - name: Make the release assets again with every executable
        run: |
          node tooling/create-github-release-assets.mjs
          node tooling/verify-github-release-assets.mjs --all-launchers
          cat dist/multi-chain-edition/release/SHA256SUMS

      - name: Generate GitHub build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/multi-chain-edition/release/*'

      - name: Publish the verified release with flat downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release candidate uses the notes of its version and stays a pre-release, so it is
          # never marked Latest and the Dash Community workflow, which takes only final releases,
          # ignores it.
          RELEASE_KIND=(--latest)
          TITLE="$GITHUB_REF_NAME"
          BASE_TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" =~ -rc\.[0-9]+$ ]]; then
            BASE_TAG="${GITHUB_REF_NAME%-rc.*}"
            RELEASE_KIND=(--prerelease --latest=false)
            TITLE="$GITHUB_REF_NAME (release candidate)"
          fi
          NOTES_FILE="docs/releases/$BASE_TAG.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing curated release notes: $NOTES_FILE" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/multi-chain-edition/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$NOTES_FILE" \
            "${RELEASE_KIND[@]}" \
            --title "$TITLE"
