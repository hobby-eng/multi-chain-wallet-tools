name: Build and publish GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the tag to match package.json
        run: |
          EXPECTED_TAG="v$(jq --raw-output '.version' package.json)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Verify sources and build release assets in the canonical container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.reproducible \
            --target artifacts \
            --tag multi-chain-wallet-tools-release:${GITHUB_SHA} \
            .
          container_id=$(docker create multi-chain-wallet-tools-release:${GITHUB_SHA} /bin/true)
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/dist/." dist
          cat dist/release/SHA256SUMS

      - name: Generate GitHub build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/release/*'

      - name: Publish the verified release with flat downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing curated release notes: $NOTES_FILE" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$NOTES_FILE" \
            --latest \
            --title "$GITHUB_REF_NAME"
