name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check metadata, types and code ownership
        run: pnpm check
      - name: Check formatting
        run: pnpm format:check
      - name: Run bounded build-policy contracts
        run: pnpm exec vitest run tooling/tool-build-policy.test.mjs tooling/rust-toolchain.test.mjs tooling/wasm-catalog.test.mjs tooling/vendored-mhfe-package.test.mjs --maxWorkers=1

  canonical:
    # Full builds run only by an explicit pre-release request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify in the canonical pinned container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.reproducible \
            --build-arg SOURCE_COMMIT=${GITHUB_SHA} \
            --build-arg SOURCE_DIRTY=false \
            --target artifacts \
            --tag multi-chain-wallet-tools-ci:${GITHUB_SHA} \
            .

      - name: Print release checksums in the public log
        run: |
          container_id=$(docker create multi-chain-wallet-tools-ci:${GITHUB_SHA} /bin/true)
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/dist/." dist
          cat dist/multi-chain-edition/release/SHA256SUMS

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build standalone HTML from committed WASM
        run: pnpm build:html

      - name: Run direct-file browser acceptance
        run: pnpm test:browser:files

      - name: Run extended browser regressions
        run: pnpm test:browser:regressions

      - name: Run selective-build browser smoke
        run: pnpm test:browser:selective

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
