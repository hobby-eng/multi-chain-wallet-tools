name: Source and artifact checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify in the canonical pinned container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.reproducible \
            --target artifacts \
            --tag multi-chain-wallet-tools-ci:${GITHUB_SHA} \
            .

      - name: Print release checksums in the public log
        run: |
          container_id=$(docker create multi-chain-wallet-tools-ci:${GITHUB_SHA} /bin/true)
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/dist/." dist
          cat dist/release/SHA256SUMS
