name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify in the canonical pinned container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.reproducible \
            --build-arg SOURCE_COMMIT=${GITHUB_SHA} \
            --build-arg SOURCE_DIRTY=false \
            --target artifacts \
            --tag multi-chain-wallet-tools-ci:${GITHUB_SHA} \
            .

      - name: Print release checksums in the public log
        run: |
          container_id=$(docker create multi-chain-wallet-tools-ci:${GITHUB_SHA} /bin/true)
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/dist/." dist
          cat dist/multi-chain-edition/release/SHA256SUMS

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Node and pnpm runtimes
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          version: 12.5.1
          runtime: node@24.21.0
          cache: true

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build standalone HTML from committed WASM
        run: pnpm build:html

      - name: Run direct-file browser acceptance
        run: pnpm test:browser:files

      - name: Run extended browser regressions
        run: pnpm test:browser:regressions

      - name: Run selective-build browser smoke
        run: pnpm test:browser:selective

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
