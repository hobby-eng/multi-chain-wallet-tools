name: Source and artifact checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: true
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.19.0

      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify sources and rebuild all standalone HTML
        run: pnpm verify:ci

      - name: Print release checksums in the public log
        run: cat dist/release/SHA256SUMS
