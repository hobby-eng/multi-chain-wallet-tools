name: Executable Deriver

# Builds the executable Key Derivation Tool the way a release does and runs each one on its own
# system: Dockerfile.launchers for Linux and Windows, a macOS runner for macOS. On every system
# tooling/verify-key-derivation-launcher.mjs starts the real program and checks the served page in
# Chromium: headers, refusals, isolation, fast mode, an MHFE worker, no requests and no storage.

on:
  push:
    branches: [main]
    paths:
      - 'apps/key-derivation/**'
      - 'packages/**'
      - 'tooling/**'
      - 'Dockerfile.launchers'
      - '.github/workflows/launchers.yml'
  pull_request:
    paths:
      - 'apps/key-derivation/**'
      - 'packages/**'
      - 'tooling/**'
      - 'Dockerfile.launchers'
      - '.github/workflows/launchers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launchers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Dockerfile.launchers takes the Deriver pages of both editions.
      - name: Build the Deriver pages from committed WASM
        run: |
          pnpm build:quick
          node apps/key-derivation/scripts/build-key-derivation-html.mjs --profile dash-community

      - name: Build the Linux and Windows executables in the pinned container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.launchers \
            --build-context dist=dist \
            --target launchers \
            --output type=local,dest=launcher-output \
            .
          cp launcher-output/dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-* \
            dist/multi-chain-edition/key-derivation/
          sha256sum dist/multi-chain-edition/key-derivation/*

      - name: Keep the page and the executables for the systems that run them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deriver
          path: dist/multi-chain-edition/key-derivation/
          if-no-files-found: error
          retention-days: 3

  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Take the page and the executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deriver
          path: dist/multi-chain-edition/key-derivation

      # The macOS executables are built here, around the same page, as the release workflow does.
      - name: Build the macOS executable
        if: runner.os == 'macOS'
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin
          cargo fetch --locked --manifest-path apps/key-derivation/launcher/Cargo.toml
          node tooling/build-key-derivation-launchers.mjs --platforms macos-aarch64

      # A downloaded artifact loses its executable bit, as a browser download does.
      - name: Allow the executable to run
        if: runner.os != 'Windows'
        run: chmod +x dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-*

      - name: Run the executable and check the page it serves
        run: node tooling/verify-key-derivation-launcher.mjs
