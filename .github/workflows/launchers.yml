name: Executable Deriver

# Builds the executable Key Derivation Tool the way a release does and runs it on three systems:
# Dockerfile.launchers for Linux and Windows, a macOS runner for macOS. On x86-64 Linux, Windows and
# Apple-silicon macOS tooling/verify-key-derivation-launcher.mjs starts the real program and checks
# the served page in Chromium: headers, refusals, isolation, fast mode, an MHFE worker, no requests
# and no storage. The ARM Linux and Intel macOS programs are started by the release workflow,
# which runs all five before it publishes. This workflow runs only by manual dispatch;
# routine pushes and pull requests keep the bounded source checks in ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launchers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Dockerfile.launchers takes the Deriver pages of both editions.
      - name: Build the Deriver pages from committed WASM
        run: |
          pnpm build:quick
          node apps/key-derivation/scripts/build-key-derivation-html.mjs --profile dash-community

      - name: Build the Linux and Windows executables in the pinned container
        run: |
          docker build --platform linux/amd64 \
            --network host \
            --file Dockerfile.launchers \
            --build-context dist=dist \
            --target launchers \
            --output type=local,dest=launcher-output \
            .
          cp launcher-output/dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-* \
            dist/multi-chain-edition/key-derivation/
          sha256sum dist/multi-chain-edition/key-derivation/*

      - name: Keep the page and the executables for the systems that run them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deriver
          path: dist/multi-chain-edition/key-derivation/
          if-no-files-found: error
          retention-days: 3

  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm runtime
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked JavaScript dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Take the page and the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deriver
          path: dist/multi-chain-edition/key-derivation

      # The macOS executables are built here, around the same page, as the release workflow does.
      - name: Build the macOS executable
        if: runner.os == 'macOS'
        run: |
          rust_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("tooling/toolchain-pins.json", "utf8")).rust')"
          echo "RUSTUP_TOOLCHAIN=${rust_version}" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$rust_version"
          rustup toolchain install "$rust_version" --profile minimal --target aarch64-apple-darwin
          cargo fetch --locked --manifest-path apps/key-derivation/launcher/Cargo.toml
          node tooling/build-key-derivation-launchers.mjs --platforms macos-aarch64

      # A downloaded artifact loses its executable bit, as a browser download does.
      - name: Allow the executable to run
        if: runner.os != 'Windows'
        run: chmod +x dist/multi-chain-edition/key-derivation/Wallet_Key_Derivation_Tool-*

      - name: Run the executable and check the page it serves
        run: node tooling/verify-key-derivation-launcher.mjs
