[package]
name = "recovery-shamir-wasm"
version = "0.1.5"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
sharks = { version = "=0.5.0", default-features = false, features = ["zeroize_memory"] }
wasm-bindgen = "=0.2.128"
zeroize = "=1.8.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
