[package]
name = "sskr"
version = "0.12.0"
edition = "2024"
license = "BSD-2-Clause-Patent"
repository = "https://github.com/BlockchainCommons/bc-sskr-rust"
description = "Pinned SSKR 0.12.0 with MnemoCode secret-lifetime fixes."
publish = false

[dependencies]
bc-rand = "=0.5.0"
bc-shamir = { version = "=0.13.0", path = "../bc-shamir-0.13.0" }
thiserror = "=2.0.21"
zeroize = "=1.9.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
