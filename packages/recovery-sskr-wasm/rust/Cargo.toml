[package]
name = "recovery-sskr-wasm"
version = "0.1.5"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bc-rand = "=0.5.0"
bc-ur = "=0.19.2"
bc-tags = "=0.12.0"
dcbor = "=0.25.2"
sskr = "=0.12.0"
rand_chacha = "=0.9.0"
rand_core = "=0.9.3"
wasm-bindgen = "=0.2.128"
zeroize = "=1.8.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
