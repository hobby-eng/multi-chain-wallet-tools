[package]
name = "recovery-sskr-wasm"
version = "0.1.9"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bc-rand = "=0.5.0"
bc-ur = "=0.19.2"
bc-tags = "=0.12.0"
sskr = { version = "=0.12.0", path = "vendor/sskr-0.12.0" }
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"
wasm-bindgen = "=0.2.129"
zeroize = "=1.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

[workspace]
members = ["vendor/sskr-0.12.0", "vendor/bc-shamir-0.13.0"]
resolver = "2"
