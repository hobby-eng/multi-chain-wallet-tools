[package]
name = "recovery-envelope-wasm"
version = "0.1.4"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bc-components = { version = "=0.31.1", default-features = false }
bc-envelope = { version = "=0.43.0", default-features = false, features = ["secret", "types", "recipient", "sskr"] }
dcbor = "=0.25.2"
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.128"
zeroize = "=1.8.2"


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
