[package]
name = "recovery-codex32-wasm"
version = "0.1.4"
edition = "2021"
rust-version = "1.85.1"
license = "CC0-1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codex32 = "=0.1.0"
wasm-bindgen = "=0.2.128"
zeroize = "=1.8.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
