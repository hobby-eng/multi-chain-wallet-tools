[package]
name = "dash-shielded-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
orchard = { git = "https://github.com/dashpay/orchard.git", tag = "dashified-0.14.1", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.127"
zip32 = { version = "=0.2.0", default-features = false }

[dev-dependencies]
bech32 = "=0.11.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
